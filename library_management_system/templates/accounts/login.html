{% load static %}

<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Library Management System</title>

<link rel="stylesheet" href="{% static 'css/main.css' %}">

</head>

<body>

<div class="main-content">

<div class="card">

    <h1>Please Login to Continue</h1>

    <p>
        Login to access your library account.
    </p>

    {% if messages %}
        {% for message in messages %}
            <p class="status-pending">
                {{ message }}
            </p>
        {% endfor %}
    {% endif %}

    {% if error %}
        <p class="status-expired">
            {{ error }}
        </p>
    {% endif %}


    <form method="post">

        {% csrf_token %}

        <table>

            <tr>
                <td>
                    <label for="email">
                        Email:
                    </label>
                </td>

                <td>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </td>
            </tr>


            <tr>
                <td>
                    <label for="password">
                        Password:
                    </label>
                </td>

                <td>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                    >
                </td>
            </tr>

        </table>

        <br>

        <button type="submit">
            Login
        </button>

    </form>

    <br>

    <p>
        New User?
        <a href="{% url 'signup' %}">
            Signup here
        </a>
    </p>

</div>

</div>

</body> </html>
